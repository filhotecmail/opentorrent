[package]
name = "opentorrent"
version = "0.1.29"
edition = "2024"
rust-version = "1.85"
description = "Terminal CLI to download torrents and magnet links"
license = "MIT"
repository = "https://github.com/filhotecmail/opentorrent"

# `coverage_nightly` é um cfg custom definido apenas no job de cobertura
# (coverage.yml) para habilitar `#[coverage(off)]` em entrypoints de rede/TUI
# que não são unit-testáveis. `coverage` é um cfg bem-conhecido do rustc
# (instrument-coverage), declarado aqui para silenciar o `unexpected_cfgs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage, coverage_nightly)"] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6"
futures = "0.3"
indicatif = "0.18.6"
librqbit = { version = "8.1.1", default-features = false, features = ["rust-tls", "http-api-client"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde_json = "1"
size_format = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"

[profile.dev]
debug = 0
strip = "debuginfo"
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "FilhoTec <filhotecmail@gmail.com>"

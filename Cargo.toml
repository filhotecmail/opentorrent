[package]
name = "opentorrent"
version = "0.1.23"
edition = "2024"
description = "Terminal CLI to download torrents and magnet links"
license = "MIT"
repository = "https://github.com/filhotecmail/opentorrent"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
futures = "0.3"
indicatif = "0.18.6"
librqbit = { version = "8.1.1", default-features = false, features = ["rust-tls", "http-api-client"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde_json = "1"
size_format = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 0
strip = "debuginfo"
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

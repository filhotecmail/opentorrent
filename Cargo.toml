[package]
name = "opentorrent"
version = "0.1.0"
edition = "2021"
description = "Terminal CLI to download torrents and magnet links"
license = "MIT"
repository = "https://github.com/yourname/opentorrent"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
librqbit = { version = "8.1.1", default-features = false, features = ["rust-tls", "http-api-client"] }
size_format = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true

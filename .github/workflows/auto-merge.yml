name: Auto Merge

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened, reopened, ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Merge PR
    if: |
      github.event.workflow_run.conclusion == 'success' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-merge'))
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
          merge-method: squash

      - name: Check if all required checks passed
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.workflow_run.head_sha,
              per_page: 100
            });
            
            const requiredChecks = ['fmt', 'clippy', 'test', 'machete'];
            const failed = checks.check_runs
              .filter(r => requiredChecks.includes(r.name) && r.conclusion !== 'success')
              .map(r => r.name);
            
            if (failed.length > 0) {
              core.setFailed(`Checks falharam: ${failed.join(', ')}`);
            }
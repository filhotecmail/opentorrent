name: Auto Merge

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened, reopened, ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Auto Merge PR
    if: |
      github.event.workflow_run.conclusion == 'success' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-merge'))
    runs-on: ubuntu-latest
    steps:
      # Governança: auto-merge somente para PRs do dono do repositório
      # (filhotecmail) ou PRs de bump automático criados pelo pipeline
      # (github-actions[bot]). PRs de contribuidores NUNCA são auto-mergeados.
      - name: Verificar autor do PR
        id: author
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUM="${{ github.event.pull_request.number }}"
          else
            PR_NUM="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          fi
          if [[ -z "$PR_NUM" ]]; then
            echo "Nenhum PR associado a esta execução — auto-merge não habilitado."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AUTHOR="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUM" --jq '.user.login')"
          TITLE="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUM" --jq '.title')"
          if [[ "$AUTHOR" == "filhotecmail" ]] || [[ "$TITLE" == "chore: bump versão para "* ]]; then
            echo "Auto-merge liberado: autor $AUTHOR (dono do repositório ou bump do pipeline)."
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Auto-merge NEGADO: PR de $AUTHOR (contribuidor — requer revisão manual)."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        if: steps.author.outputs.allowed == 'true'
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
          merge-method: squash

      - name: Check if all required checks passed
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.workflow_run.head_sha,
              per_page: 100
            });
            
            const requiredChecks = ['fmt', 'clippy', 'test', 'machete'];
            const failed = checks.check_runs
              .filter(r => requiredChecks.includes(r.name) && r.conclusion !== 'success')
              .map(r => r.name);
            
            if (failed.length > 0) {
              core.setFailed(`Checks falharam: ${failed.join(', ')}`);
            }
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Os nomes dos jobs são os contextos exigidos pela proteção da branch
  # master (fmt, clippy, test, machete) e pelo workflow de auto-merge.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Verificar formatação
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev mold

      - name: Lint com clippy (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev mold

      - name: Compilar testes (sem rodar)
        run: cargo test --locked --all-targets --no-run

      - name: Rodar testes
        run: cargo test --locked --all-targets

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev mold

      - name: Instalar cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Detectar dependências não usadas
        run: cargo machete

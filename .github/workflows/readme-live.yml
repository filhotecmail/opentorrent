name: README vivo

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [master]
    paths: [Cargo.toml, Cargo.lock]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-live
  cancel-in-progress: false

jobs:
  update-readme:
    name: Atualizar README com estado do projeto
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Instalar dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Executar gerador do README
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/update-readme.sh

      # A branch master é protegida (exige PR), então o push direto é
      # rejeitado. Em vez disso, abre um PR que aguarda a aprovação manual do
      # dono (workflow Aprovar PR) para ser mergeado. O branch usa timestamp
      # para nunca reutilizar um PR já mergeado do branch antigo.
      - name: Abrir PR com as mudanças do README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "README inalterado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: atualiza README com estado atual do projeto (auto)"
          BRANCH="docs/readme-live-update-$(date +%Y%m%d-%H%M%S)"
          git push origin "HEAD:$BRANCH"
          TITLE="docs: atualiza README com estado do projeto (auto)"
          BODY="Atualização automática do README (badges, estado do projeto e metadados) pelo workflow README vivo."
          PR_URL="$(gh pr create --base master --head "$BRANCH" --title "$TITLE" --body "$BODY")"
          PR_NUM="$(basename "$PR_URL")"
          # Sem auto-merge: aguarda a aprovação manual do dono (workflow Aprovar PR).
          echo "PR #$PR_NUM aberto — aguardando aprovação manual do dono."

name: README vivo

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [master]
    paths: [Cargo.toml, Cargo.lock]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: readme-live
  cancel-in-progress: false

jobs:
  update-readme:
    name: Atualizar README com estado do projeto
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Executar gerador do README
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/update-readme.sh

      - name: Commitar mudanças se houver
        run: |
          if git diff --quiet; then
            echo "README inalterado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: atualiza README com estado atual do projeto (auto)"
          git push

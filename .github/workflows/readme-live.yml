name: README vivo

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [master]
    paths: [Cargo.toml, Cargo.lock]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-live
  cancel-in-progress: false

jobs:
  update-readme:
    name: Atualizar README com estado do projeto
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Instalar dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Executar gerador do README
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/update-readme.sh

      # A branch master é protegida (exige PR), então o push direto é
      # rejeitado. Em vez disso, abre (ou atualiza) um PR com auto-merge
      # habilitado — o merge ocorre automaticamente quando o CI passa.
      - name: Abrir PR com as mudanças do README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "README inalterado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: atualiza README com estado atual do projeto (auto)"
          BRANCH="docs/readme-live-update"
          git push -f origin "HEAD:$BRANCH"
          TITLE="docs: atualiza README com estado do projeto (auto)"
          BODY="Atualização automática do README (badges, estado do projeto e metadados) pelo workflow README vivo."
          PR_NUM="$(gh pr view "$BRANCH" --json number --jq .number 2>/dev/null || true)"
          if [[ -n "$PR_NUM" ]]; then
            gh pr edit "$PR_NUM" --title "$TITLE" --body "$BODY"
            gh pr ready "$PR_NUM" 2>/dev/null || true
          else
            gh pr create --base master --head "$BRANCH" --title "$TITLE" --body "$BODY" --auto
          fi

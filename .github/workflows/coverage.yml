name: Cobertura

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Cobertura de código (cargo llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # US-039/coverage: toolchain nightly para `#[coverage(off)]`
      # (`feature(coverage_attribute)`), ativado via cfg `coverage_nightly`.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Instalar dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev mold

      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@1da26bc4469e032e9a8df29e9df3d9b0bef98229 # cargo-llvm-cov

      # `coverage_nightly` habilita `#[coverage(off)]` nos entrypoints de
      # rede/TUI (src/main.rs, src/session_ui.rs) — excluídos da medição pois
      # exigem uma Session real e não são unit-testáveis.
      - name: Medir cobertura
        env:
          RUSTFLAGS: "--cfg coverage_nightly"
        run: |
          mkdir -p ./coverage
          cargo llvm-cov --all-targets --cobertura --output-path ./coverage/cobertura.xml

      - name: Subir relatório de cobertura (artefato)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-xml
          path: ./coverage/cobertura.xml
          if-no-files-found: error

      - name: Publicar cobertura no Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

name: Cobertura

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Cobertura de código (cargo llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # US-039/coverage: toolchain nightly para `#[coverage(off)]`
      # (`feature(coverage_attribute)`), ativado via cfg `coverage_nightly`.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev mold

      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # `coverage_nightly` habilita `#[coverage(off)]` nos entrypoints de
      # rede/TUI (src/main.rs, src/session_ui.rs) — excluídos da medição pois
      # exigem uma Session real e não são unit-testáveis.
      - name: Medir cobertura
        env:
          RUSTFLAGS: "--cfg coverage_nightly"
        run: |
          mkdir -p ./coverage
          cargo llvm-cov --all-targets --cobertura --output-path ./coverage/cobertura.xml

      - name: Subir relatório de cobertura (artefato)
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-xml
          path: ./coverage/cobertura.xml
          if-no-files-found: error

      - name: Publicar cobertura no Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

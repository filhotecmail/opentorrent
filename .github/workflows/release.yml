name: Release

# US-030: pipeline de CI/CD que compila e publica o binário de release a partir
# do commit mais recente da branch master (ou da tag de versão disparada), com
# validação pré-publicação da versão e artefatos com nome estável para a
# instalação via /releases/latest.
#
# Disparos:
#   - push de tag `v*`          → publica com a própria tag.
#   - push na branch master     → publica usando a versão do Cargo.toml como
#                                 tag (`vA.B.C`), desde que essa release ainda
#                                 não exista (evita duplicatas em pushes sem
#                                 bump de versão).
#   - workflow_dispatch         → publica com a tag informada (ou, se vazia,
#                                 com a versão do Cargo.toml).

on:
  push:
    tags: ["v*"]
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do release (vX.Y.Z). Se vazio, usa a versão do Cargo.toml."
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Determina a tag do release e se ela já existe (guarda anti-duplicata).
  check:
    name: Determinar tag do release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir tag do release
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            # Push na master: usa a versão do Cargo.toml como tag.
            PKG_VER="$(awk -F'=' '/^version/ {gsub(/[" ]/,"",$2); print $2; exit}' Cargo.toml)"
            TAG="v${PKG_VER}"
            echo "Versão do Cargo.toml: $PKG_VER"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERRO: tag inválida: $TAG (esperado vX.Y.Z)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release alvo: $TAG (commit ${{ github.sha }})"

      # Push de tag ou dispatch manual: publica sempre (intenção explícita).
      # Push na master: pula se a release já existir (ex.: push sem bump).
      # GH_TOKEN é necessário para o `gh` CLI autenticar no runner.
      - name: Verificar se a release já existe
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [[ "${{ github.ref_type }}" == "tag" ]] || [[ -n "${{ inputs.tag }}" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG já publicada — pulando (push na master sem bump de versão)."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # Compila o binário para Windows (nativo em windows-latest) e o compartilha
  # com o job de publicação via artefato. Não assina (a assinatura RSA-SHA256
  # local é aplicada apenas ao binário Linux pelo job `release`).
  windows:
    name: Compilar para Windows
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Compilar binário de release
        run: cargo build --release --verbose

      - name: Empacotar artefato Windows
        shell: bash
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          mkdir -p dist
          cp target/release/opentorrent.exe "dist/opentorrent-$TAG-windows-x86_64.exe"
          cp target/release/opentorrent.exe "dist/opentorrent-windows-x86_64.exe"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist
          retention-days: 1

  release:
    name: Compilar e publicar release
    needs: [check, windows]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      # AC-1: checkout com o hash exato da tag/branch disparada (fetch-depth 0).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev mold openssl

      # AC-2: sanitiza caches de build antigos — recompilação total dos arquivos
      # alterados. O job de release não restaura cache de builds anteriores.
      - name: Sanitizar caches de build antigos
        run: cargo clean

      - name: Compilar binário de release (verbose)
        run: cargo build --release --verbose

      # AC-3: validação pré-publicação — o `--version` do binário deve retornar
      # a versão correspondente à tag do release. A saída é gravada em arquivo
      # (sem pipe) para evitar broken pipe/panic do stdout quando lida com head.
      # O match é ANCORADO (^OpenTorrent $TAG$) para evitar falso-positivo de
      # substring (ex.: tag v0.1.1 casando com binário v0.1.16).
      - name: Validar versão do binário
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          ./target/release/opentorrent --version > /tmp/opentorrent-version.txt 2>&1 || true
          OUTPUT="$(head -n 1 /tmp/opentorrent-version.txt)"
          echo "Versão retornada: $OUTPUT"
          if [[ "$OUTPUT" == "OpenTorrent $TAG" ]]; then
            echo "OK: a versão do binário corresponde exatamente à tag $TAG"
          else
            echo "ERRO: a versão do binário ($OUTPUT) não corresponde à tag $TAG" >&2
            exit 1
          fi

      # US-018: assina o binário com a CA local (RSA-SHA256) e valida a
      # integridade — qualquer falha de verificação falha a esteira.
      - name: Assinar binário de release
        run: ./scripts/sign-release.sh sign

      # AC-4: artefatos com nome estável (instalação via /releases/latest) e
      # nome versionado (rastreabilidade exata da versão), ambos com .sig.
      # Primeiro agrega o .exe do Windows compilado no job `windows`.
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
          merge-multiple: true

      - name: Empacotar artefatos Linux
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          mkdir -p dist
          cp target/release/opentorrent "dist/opentorrent-$TAG-linux-x86_64"
          cp target/release/opentorrent "dist/opentorrent-linux-x86_64"
          cp target/release/opentorrent.sig "dist/opentorrent-$TAG-linux-x86_64.sig"
          cp target/release/opentorrent.sig "dist/opentorrent-linux-x86_64.sig"
          ls -lh dist

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenTorrent ${{ needs.check.outputs.tag }}
          body: |
            Release gerado automaticamente pelo pipeline de CI/CD (US-030) a
            partir do commit `${{ github.sha }}` (${{ github.ref_name }}).

            Instalação (Ubuntu):

            ```bash
            curl -L -o opentorrent https://github.com/filhotecmail/opentorrent/releases/latest/download/opentorrent-linux-x86_64
            chmod +x opentorrent
            sudo mv opentorrent /usr/local/bin/
            ```

            Instalação (Windows — PowerShell):

            ```powershell
            Invoke-WebRequest -Uri https://github.com/filhotecmail/opentorrent/releases/latest/download/opentorrent-windows-x86_64.exe -OutFile opentorrent.exe
            .\opentorrent.exe --version
            ```

            Para executar o comando `opentorrent` de qualquer diretório (sem o
            prefixo `.\`), adicione a pasta do binário ao `PATH`:

            ```powershell
            New-Item -ItemType Directory -Force -Path "$HOME\bin" | Out-Null
            Move-Item -Force .\opentorrent.exe "$HOME\bin\opentorrent.exe"
            $env:Path += ";$HOME\bin"
            opentorrent --version
            ```
          files: dist/*
          fail_on_unmatched_files: true
